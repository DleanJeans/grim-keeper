# Test: Browse scripts, preview, save, verify saved tab
# Run with: maestro test .maestro/expo-go/scripts/browse-preview-save.yaml
# Run with: maestro test --udid <emulator-id> .maestro/expo-go/scripts/browse-preview-save.yaml
# Requires: Expo dev server running AND app loaded on emulator

appId: host.exp.exponent
env:
  SCRIPT_NAME: One in one out
onFlowStart:
  - clearState:
      appId: host.exp.exponent
---
# Kill any existing app session and wipe its state
- launchApp:
    appId: host.exp.exponent
    stopApp: true

- waitForAnimationToEnd:
    timeout: 1000

- openLink: exp://192.168.0.100:8081/--/scripts

- tapOn:
    text: Continue
    optional: true
- back

- assertNotVisible: Saved (1)
- assertVisible: Saved (0)

- tapOn: Search botcscripts.com...
- inputText: ${SCRIPT_NAME}
- tapOn:
    text: Search
    index: 0

- assertVisible: Preview

- tapOn: Preview

- assertVisible: Save Script

- assertNotVisible: Unknown roles

- tapOn: Save Script

# Saved script should not be able to save again
- tapOn: Preview
- assertNotVisible: Save Script
- tapOn: Close

# Saved (0) should change to Saved (1)
- assertVisible: Saved (1)

- tapOn: Saved tab
- assertVisible: ${SCRIPT_NAME}

- tapOn: ${SCRIPT_NAME}

- assertVisible: Steward

- assertNotVisible: Unknown roles
- assertNotVisible: Save Script
