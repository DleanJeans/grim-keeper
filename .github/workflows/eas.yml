name: EAS

on:
  push:
    branches: ["**"]
  pull_request:
    types: labeled
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  eas:
    uses: DleanJeans/expo-workflows/.github/workflows/eas.yml@main
    with:
      app-name: grim-keeper
      expo-project-slug: grim-keeper
      ota-label: send ota
    secrets:
      expo-token: ${{ secrets.EXPO_TOKEN }}
