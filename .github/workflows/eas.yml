name: EAS

on:
  # Every push to main publishes an OTA on the preview branch (no APK unless the
  # commit message says build-preview or build-apk; skip-ota opts out).
  push:
    branches: [main]
  pull_request:
    types: labeled
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile to build
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: write
  pull-requests: write

jobs:
  eas:
    uses: DleanJeans/expo-workflows/.github/workflows/eas.yml@main
    with:
      app-name: grim-keeper
      expo-project-slug: grim-keeper
      ota-label: send ota
      profile: ${{ inputs.profile || '' }}
    secrets:
      expo-token: ${{ secrets.EXPO_TOKEN }}
      ntfy-topic: ${{ secrets.NTFY_TOPIC }}
